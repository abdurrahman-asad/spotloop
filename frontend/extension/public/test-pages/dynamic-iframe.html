<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Test Dynamic Iframes Injection</title>
    <style>
      iframe {
        width: 600px;
        height: 400px;
        border: 1px solid #ccc;
        margin-bottom: 20px;
      }
      #dynamic-container {
        margin-top: 40px;
      }
    </style>
  </head>
  <body>
    <h1>Static Iframes</h1>

    <iframe src="https://en.wikipedia.org/wiki/OpenAI" title="Wikipedia - OpenAI"></iframe>
    <iframe
      src="https://en.wiktionary.org/wiki/intelligence"
      title="Wiktionary - Intelligence"></iframe>

    <h1>Dynamic Iframes</h1>

    <div id="dynamic-container"></div>

    <script>
      setTimeout(() => {
        const container = document.getElementById('dynamic-container');

        const iframe1 = document.createElement('iframe');
        iframe1.src = 'https://en.wikipedia.org/wiki/Artificial_intelligence';
        iframe1.title = 'Wikipedia - Artificial Intelligence';
        container.appendChild(iframe1);

        const iframe2 = document.createElement('iframe');
        iframe2.src = 'https://en.wikivoyage.org/wiki/San_Francisco';
        iframe2.title = 'Wikivoyage - San Francisco';
        container.appendChild(iframe2);
      }, 5000);
    </script>
  </body>
</html>
